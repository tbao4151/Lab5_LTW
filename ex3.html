<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 3 - Random color picker - Lab 5</title><link rel="stylesheet" href="style.css"></head><body><main><p><a href="index.html">← Lab 5 - Trang chủ</a></p><h1>Exercise 3 - Random color picker</h1><section class="card" id="colorPanel"><p>Hover to preview a color. Click to select permanently.</p><div id="palette" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px"></div><p>Selected color: <strong id="selected">None</strong></p><p id="toast" role="status" style="opacity:0;transition:opacity .35s"></p></section></main><script>const palette=document.querySelector('#palette'),panel=document.querySelector('#colorPanel'),toast=document.querySelector('#toast'),selected=document.querySelector('#selected');let chosen='white',timeout;const color=()=>`#${Math.floor(Math.random()*16777216).toString(16).padStart(6,'0')}`;for(let i=0;i<48;i++){const c=color(),cell=document.createElement('button');cell.style=`background:${c};height:56px;border:2px solid #fff`;cell.title=c;cell.setAttribute('aria-label','Select '+c);cell.addEventListener('mouseenter',()=>{panel.style.background=c});cell.addEventListener('mouseleave',()=>{panel.style.background=chosen});cell.addEventListener('click',()=>{chosen=c;panel.style.background=c;selected.textContent=c;toast.textContent='Color selected: '+c;toast.style.opacity='1';clearTimeout(timeout);timeout=setTimeout(()=>toast.style.opacity='0',2600)});palette.append(cell)}palette.addEventListener('mouseleave',()=>panel.style.background=chosen);</script></body></html>
