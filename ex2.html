<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 2 — Login form</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
</head>
<body>
  <main class="container pt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-9 col-md-7 col-lg-6 col-xl-5">
        <form class="border rounded p-4" action="#" method="get">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-group">
              <div class="input-group-prepend"><span class="input-group-text" aria-hidden="true">&#64;</span></div>
              <input type="text" id="username" name="username" class="form-control" placeholder="Username" autocomplete="username">
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-group">
              <div class="input-group-prepend"><span class="input-group-text" aria-hidden="true">&#8226;</span></div>
              <input type="password" id="password" name="password" class="form-control" placeholder="Password" autocomplete="current-password">
            </div>
          </div>
          <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <button class="btn btn-success px-5" type="button">Login</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
