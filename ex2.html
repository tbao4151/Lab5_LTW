<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 2 - Password strength - Lab 5</title><link rel="stylesheet" href="style.css"></head><body><main><p><a href="index.html">← Lab 5 - Trang chủ</a></p><h1>Exercise 2 - Password strength</h1><section class="card"><label class="field">Password<input id="password" type="password" autocomplete="new-password" placeholder="Type password here"></label><p id="rating" role="status">Strength: Empty</p><div id="rules"></div></section></main><script>const tests=[['At least 8 characters',s=>s.length>=8],['At least one uppercase letter',s=>/[A-Z]/.test(s)],['At least one lowercase letter',s=>/[a-z]/.test(s)],['At least one digit',s=>/[0-9]/.test(s)],['At least one special character',s=>/[^A-Za-z0-9]/.test(s)]],rules=document.querySelector('#rules');for(const [title] of tests){const el=document.createElement('p');el.textContent=title;el.style='padding:12px;color:white;border-radius:6px;background:#8c1225';rules.append(el)}document.querySelector('#password').addEventListener('input',e=>{const s=e.target.value;let met=0;tests.forEach(([,fn],i)=>{const yes=fn(s);met+=yes;rules.children[i].style.background=yes?'#16703a':'#8c1225'});document.querySelector('#rating').textContent='Strength: '+(!s?'Empty':met===5?'Very strong':met>=4?'Strong':met>=3?'Medium':'Weak')+' ('+met+'/5 criteria)'});</script></body></html>
