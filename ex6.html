<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 6 - Drag and drop puzzle - Lab 5</title><link rel="stylesheet" href="style.css"></head><body><main><p><a href="index.html">← Lab 5 - Trang chủ</a></p><h1>Exercise 6 - Drag and drop puzzle</h1><section class="card"><p>Rotate pieces with a click (90° each time), then drag them into empty spaces in the 2 × 5 board. Pieces cannot be placed in occupied cells. Use Reset for a new shuffle.</p><button id="reset">Shuffle / Reset</button><p id="feedback" role="status"></p><h2>Source pieces</h2><div id="source" class="puzzle-grid"></div><h2>Target board</h2><div id="target" class="puzzle-grid"></div></section><style>.puzzle-grid{display:grid;grid-template-columns:repeat(5,minmax(70px,1fr));gap:8px;max-width:800px;margin:16px 0 28px}.slot{aspect-ratio:1;border:2px dashed #a9bad1;border-radius:8px;display:grid;place-items:center;background:#edf2f8;overflow:hidden}.piece{width:100%;height:100%;object-fit:contain;cursor:grab;user-select:none;transition:transform .2s}.slot.over{border-color:#245abd;background:#dce9ff}@media(max-width:560px){.puzzle-grid{gap:4px}.slot{border-width:1px}}</style></main><script>const N=10,source=document.querySelector('#source'),target=document.querySelector('#target'),feedback=document.querySelector('#feedback');let pieces=[],locations=[];const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function render(){source.replaceChildren();target.replaceChildren();for(let pos=0;pos<2*N;pos++){const inTarget=pos>=N,index=inTarget?pos-N:pos,slot=document.createElement('div');slot.className='slot';slot.dataset.target=inTarget?'1':'0';slot.dataset.index=index;const id=locations[pos];if(id!==null){const piece=pieces[id],img=document.createElement('img');img.src='ex6/images/cntt_'+String(id+1).padStart(2,'0')+'.gif';img.className='piece';img.draggable=true;img.alt='Piece '+(id+1);img.style.transform=`rotate(${piece.angle}deg)`;img.addEventListener('click',()=>{piece.angle=(piece.angle+90)%360;render();check()});img.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',String(pos));e.dataTransfer.effectAllowed='move'});slot.append(img)}slot.addEventListener('dragover',e=>{if(locations[pos]===null){e.preventDefault();slot.classList.add('over')}});slot.addEventListener('dragleave',()=>slot.classList.remove('over'));slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('over');const from=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(from)||from<0||from>=2*N||from===pos||locations[from]===null||locations[pos]!==null)return;locations[pos]=locations[from];locations[from]=null;render();check()});(inTarget?target:source).append(slot)}}function check(){const all=locations.slice(N).every(x=>x!==null);if(!all){feedback.textContent='Move all 10 pieces to the board.';feedback.className='muted';return}const correct=locations.slice(N).every((x,i)=>x===i&&pieces[x].angle===0);feedback.textContent=correct?'Congratulations! You completed the puzzle correctly!':'All pieces placed, but the image is not correct yet. Rotate or move pieces and try again.';feedback.className=correct?'success':'error'}function reset(){pieces=Array.from({length:N},(_,id)=>({id,angle:90*Math.floor(Math.random()*4)}));locations=[...shuffle(Array.from({length:N},(_,i)=>i)),...Array(N).fill(null)];render();check()}document.querySelector('#reset').addEventListener('click',reset);reset();</script></body></html>
