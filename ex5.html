<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 5 - Product search - Lab 5</title><link rel="stylesheet" href="style.css"></head><body><main><p><a href="index.html">← Lab 5 - Trang chủ</a></p><h1>Exercise 5 - Product search</h1><section class="card"><label class="field">Search products<input id="searchBox" placeholder="e.g. thiet ke, iPhone, 900" autocomplete="off"></label><p id="count" class="muted"></p><div class="table-scroll"><table><thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Description</th></tr></thead><tbody id="productTable"></tbody></table></div><p id="noMatchMessage" class="error"></p></section></main><script>const products=[{name:'iPhone 15 Pro Max 256GB | Chính hãng VN/A',price:'32,990,000',description:'iPhone 15 Pro Max thiết kế mới với chất liệu titan chuẩn hàng không vũ trụ bền bỉ, trọng lượng nhẹ, đồng thời trang bị nút Action và cổng sạc USB-C tiêu chuẩn giúp nâng cao tốc độ sạc.',image:'https://cdn2.cellphones.com.vn/x/media/catalog/product/r/g/rgrg.jpg'},{name:'Apple Watch Series 9 41mm (4G) viền nhôm dây cao su',price:'12,790,000',description:'Apple Watch Series 9 41mm 4G sở hữu khả năng xử lý mượt mà nhờ được trang bị chip S9 SiP mạnh mẽ cùng chất lượng hiển thị sắc nét trên màn hình 1.6 inch.',image:'https://cdn2.cellphones.com.vn/insecure/rs:fill:358:358/q:80/plain/https://cellphones.com.vn/media/catalog/product/a/p/apple_gps_1_.png'},{name:'Ốp lưng iPhone 15 Pro Max Silicone hỗ trợ sạc Magsafe',price:'1,272,000',description:'Ốp lưng iPhone 15 Pro Max Silicone hỗ trợ sạc Magsafe có kiểu dáng ốp khít với nhiều màu sắc cho người dùng lựa chọn.',image:'https://cdn2.cellphones.com.vn/insecure/rs:fill:358:358/q:80/plain/https://cellphones.com.vn/media/catalog/product/o/p/op-lung-magsafe-iphone-15-pro-max-silicone.png'},{name:'iPad Air M2',price:'16,490,000',description:'Máy tính bảng hiệu năng mạnh, thiết kế mỏng nhẹ.',image:''},{name:'iMac M3',price:'34,990,000',description:'Máy tính để bàn màn hình Retina, thiết kế hiện đại.',image:''}],norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase(),table=document.querySelector('#productTable');function render(keyword=''){table.replaceChildren();const key=norm(keyword.trim()),matched=products.filter(p=>norm([p.name,p.price,p.description].join(' ')).includes(key)||norm(p.price.replace(/,/g,'')).includes(key.replace(/,/g,'')));for(const p of matched){const tr=document.createElement('tr');let td=document.createElement('td');if(p.image){const img=document.createElement('img');img.src=p.image;img.alt=p.name;img.style='width:60px;max-height:65px;object-fit:contain';td.append(img)}else td.textContent='—';tr.append(td);for(const v of [p.name,p.price,p.description]){td=document.createElement('td');td.textContent=v;tr.append(td)}table.append(tr)}document.querySelector('#count').textContent=matched.length+' matching product(s)';document.querySelector('#noMatchMessage').textContent=matched.length?'':'No matching products found.'}document.querySelector('#searchBox').addEventListener('input',e=>render(e.target.value));render();</script></body></html>
