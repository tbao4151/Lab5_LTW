<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise 1 - Student management - Lab 5</title><link rel="stylesheet" href="style.css"></head><body><main><p><a href="index.html">← Lab 5 - Trang chủ</a></p><h1>Exercise 1 - Student management</h1><section class="card"><p>Student records are synchronized with <code>http://localhost:3000/students</code> through GET, POST, PATCH and DELETE.</p><form id="form" class="row"><label class="field">Fullname<input required id="fullname" placeholder="Full name"></label><label class="field">Age<input required type="number" id="age" min="18" max="100" placeholder="Age"></label><label class="field">State<select id="state"><option value="pending">Pending</option><option value="completed">Completed</option></select></label><button>Add student</button></form><p id="message" role="status"></p><div class="table-scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>State</th><th>Actions</th></tr></thead><tbody id="students"></tbody></table></div></section></main><script>const API='http://localhost:3000/students',tbody=document.querySelector('#students'),msg=document.querySelector('#message');function note(t,bad=false){msg.textContent=t;msg.className=bad?'error':'success'}async function request(url,options){const r=await fetch(url,options);if(!r.ok)throw Error('HTTP '+r.status);return r.status===204?null:r.json()}async function load(){try{const data=await request(API);tbody.replaceChildren();for(const st of data){const tr=document.createElement('tr');for(const v of [st.id,st.name,st.age]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const state=document.createElement('td'),badge=document.createElement('span');badge.className='pill '+(st.state==='completed'?'done':'');badge.textContent=st.state==='completed'?'Completed':'Pending';state.append(badge);tr.append(state);const action=document.createElement('td'),toggle=document.createElement('button'),del=document.createElement('button');toggle.className='small';toggle.textContent='Change';del.className='small danger';del.textContent='Delete';toggle.onclick=async()=>{try{await request(API+'/'+encodeURIComponent(st.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:st.state==='completed'?'pending':'completed'})});note('Status updated');await load()}catch(e){note(e.message,true)}};del.onclick=async()=>{if(!confirm('Delete '+st.name+'?'))return;try{await request(API+'/'+encodeURIComponent(st.id),{method:'DELETE'});note('Student deleted');await load()}catch(e){note(e.message,true)}};action.append(toggle,document.createTextNode(' '),del);tr.append(action);tbody.append(tr)}if(!data.length)tbody.innerHTML='<tr><td colspan="5">No students yet</td></tr>'}catch(e){note('Cannot connect to json-server. Start it using npm run server. '+e.message,true)}}document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const name=document.querySelector('#fullname').value.trim(),age=Number(document.querySelector('#age').value),state=document.querySelector('#state').value;if(!name||!Number.isInteger(age)||age<18||age>100){note('Enter a valid name and age 18-100',true);return}try{await request(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,age,state})});e.target.reset();note('Student added');await load()}catch(err){note(err.message,true)}});load();</script></body></html>
